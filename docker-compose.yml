# Production compose — deployed by Jenkins on the `main` branch.
# Jenkins always runs `docker compose up -d --no-build`, so the build: section
# is never used at deploy time; NEXT_PUBLIC_* are passed via --build-arg in the
# Jenkinsfile Docker Build stage.
#
# Placeholders: ugt-lube-monitoring, 3000, /ugt-lube-monitoring
services:
  app:
    build:
      context: .
      target: runner
    image: ugt-lube-monitoring:latest
    # Image is built locally by Jenkins — never pull from Docker Hub
    pull_policy: never
    container_name: ugt-lube-monitoring
    restart: unless-stopped
    ports:
      # Host port comes from .env (APP_PORT) with a default; container port is
      # always 3000
      - '${APP_PORT:-3000}:3000'
    # persistent data (org contract: bind mount under /home/docker02/appdata) — attachment files
    volumes:
      - /home/docker02/appdata/ugt-lube-monitoring/storage:/app/storage
    networks:
      - proxy-network
    environment:
      # FIXED LIST — same keys, same order in every org project (= .env.example
      # sections 1–5, ugt-nextjs-database-setup/assets/env.example). Values come
      # from .env (the Jenkins Secret File copied at deploy). A module not
      # installed keeps its lines commented; its setup skill uncomments them.
      # Only the keys listed here reach the container — .env just fills ${VAR}:
      # a new runtime var is added here AND in the other compose file, same PR.
      # NEVER put NEXT_PUBLIC_* here (build args — no effect at runtime) and
      # NEVER bake secrets into image layers.
      # 1. runtime
      NODE_ENV: production
      NODE_TLS_REJECT_UNAUTHORIZED: '0' # org standard, always on: closed intranet + internal-CA Keycloak/LDAP
      CRON_SECRET: ${CRON_SECRET} # [CRON] the cron service (jobs.crontab) → /api/cron/<job>
      # 2. database
      DATABASE_URL: ${DATABASE_URL} # [DB]
      # 3. auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET} # [AUTH]
      BETTER_AUTH_URL: ${BETTER_AUTH_URL} # [AUTH]
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS} # [AUTH]
      ORG_EMAIL_DOMAINS: ${ORG_EMAIL_DOMAINS:-} # [AUTH] first = canonical, e.g. ube.com,ube.co.th
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER} # [AUTH: SSO]
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID} # [AUTH: SSO]
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET} # [AUTH: SSO]
      # LDAP_URL: ${LDAP_URL}                                       # [AUTH: LDAP]
      # LDAP_BASE_DN: ${LDAP_BASE_DN}                               # [AUTH: LDAP]
      # LDAP_DOMAIN: ${LDAP_DOMAIN}                                 # [AUTH: LDAP]
      # 4. mail
      SMTP_HOST: ${SMTP_HOST} # [MAIL]
      SMTP_PORT: ${SMTP_PORT:-25} # [MAIL]
      SMTP_SECURE: ${SMTP_SECURE:-false} # [MAIL]
      SMTP_USER: ${SMTP_USER:-} # [MAIL]
      SMTP_PASS: ${SMTP_PASS:-} # [MAIL]
      SMTP_FROM: ${SMTP_FROM} # [MAIL]
      # 5. upload
      STORAGE_ROOT: /app/storage # [UPLOAD]
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-26214400} # [UPLOAD]
      # 6. project-specific — add below, same order as .env.example section 6
      AI_PROVIDER: ${AI_PROVIDER:-glm}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
    healthcheck:
      # Always 127.0.0.1 (NOT localhost — Alpine resolves it to IPv6 ::1) and
      # always internal port 3000 (container-internal, not the host port)
      test:
        ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ugt-lube-monitoring/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # [CRON] scheduled jobs (jobs.crontab) — prod only, deployed together with the app.
  # Never in docker-compose.dev.yml (the job would run in both environments).
  cron:
    image: ugt-lube-monitoring:latest
    pull_policy: never
    container_name: ugt-lube-monitoring-cron
    restart: unless-stopped
    command: ['supercronic', '/app/jobs.crontab']
    networks:
      - proxy-network # reaches the app as http://ugt-lube-monitoring:3000
    environment:
      TZ: Asia/Bangkok
      CRON_SECRET: ${CRON_SECRET}
    healthcheck:
      disable: true # the image HEALTHCHECK probes a web server this service does not run
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

networks:
  # Shared reverse-proxy network on the Docker host (created once, externally)
  proxy-network:
    external: true
